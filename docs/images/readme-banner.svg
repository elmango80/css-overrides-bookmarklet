<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">CSS Overrides Bookmarklet</title>
  <desc id="description">Una ventana de edición CSS junto al nombre y descripción del proyecto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2328" flood-opacity="0.14"/>
    </filter>
    <clipPath id="editor-clip">
      <rect x="60" y="40" width="390" height="220" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <path d="M0 246C166 194 301 287 479 236s330-34 721-141v205H0Z" fill="#0969da" opacity="0.045"/>
  <circle cx="1104" cy="42" r="168" fill="#8250df" opacity="0.045"/>

  <g filter="url(#shadow)">
    <rect x="60" y="40" width="390" height="220" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <g clip-path="url(#editor-clip)">
      <rect x="60" y="40" width="390" height="44" fill="#eaeef2"/>
      <circle cx="84" cy="62" r="6" fill="#ff7b72"/>
      <circle cx="104" cy="62" r="6" fill="#e3b341"/>
      <circle cx="124" cy="62" r="6" fill="#57ab5a"/>
      <text x="255" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#57606a">Sobrescrituras CSS</text>

      <text x="84" y="116" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" fill="#cf222e">.focus-mode</text>
      <text x="218" y="116" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#24292f">{</text>
      <text x="106" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#0550ae">max-width</text>
      <text x="211" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#24292f">: 72ch;</text>
      <text x="106" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#0550ae">margin</text>
      <text x="179" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#24292f">: auto;</text>
      <text x="84" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#24292f">}</text>

      <rect x="272" y="224" width="154" height="28" rx="14" fill="#ddf4ff"/>
      <circle cx="290" cy="238" r="5" fill="#1a7f37"/>
      <text x="303" y="243" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#0969da">CSS activo</text>
    </g>
  </g>

  <g transform="translate(512 78)">
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="760" fill="#1f2328">CSS Overrides</text>
    <text y="54" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" font-weight="650" fill="#0969da">bookmarklet</text>
    <text y="103" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" fill="#57606a">Tu CSS, guardado por host y aplicado al instante.</text>

    <g transform="translate(0 130)">
      <rect width="170" height="42" rx="21" fill="#0969da"/>
      <text x="22" y="27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#ffffff">{ } CSS activo</text>

      <rect x="184" width="128" height="42" rx="21" fill="#ffffff" stroke="#d0d7de"/>
      <text x="208" y="27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#57606a">100% local</text>
    </g>
  </g>
</svg>
